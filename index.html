<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#131b17"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Meu Treino</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e9f1eb;background:#101713}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom))}header{padding:24px 20px 12px;background:#16221a;position:sticky;top:0;z-index:2}h1{margin:0;font-size:26px}h2{font-size:20px}small,.muted{color:#a6b5a9}main{max-width:760px;margin:auto;padding:12px 16px}.card{background:#1d2a21;border:1px solid #35473a;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.pill{background:#2d4935;padding:5px 9px;border-radius:30px;font-size:12px}button,.button{border:0;border-radius:11px;padding:12px 14px;background:#85e3a0;color:#102016;font-weight:700;cursor:pointer}button.secondary{background:#304335;color:#e6f4e9}button.danger{background:#573337;color:#fff}input,select,textarea{width:100%;background:#142019;color:#fff;border:1px solid #47604e;border-radius:9px;padding:10px;font-size:16px}label{display:block;margin:10px 0 5px;color:#c1d1c4;font-size:13px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#18251c;padding:10px 5px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #39503e;z-index:3}.tabs button{flex:1;background:transparent;color:#a4b6a8;padding:10px 2px;font-size:12px}.tabs button.active{color:#9df3b5;background:#2a3d30}.hidden{display:none}.exercise{border-top:1px solid #35483a;padding:12px 0}.set{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;align-items:center;margin:8px 0}.set input{text-align:center;padding:9px 2px}.set input[type=checkbox]{height:22px;accent-color:#8ce9a5}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.stat{font-size:24px;font-weight:800;color:#a4f4b8}#toast{position:fixed;top:14px;right:15px;background:#39533f;color:white;padding:12px;border-radius:12px;z-index:10;display:none}details{margin-top:10px}summary{cursor:pointer;color:#a9e9b9} .badge{font-size:12px;color:#a7dcb6} .topline{display:flex;justify-content:space-between;align-items:center;gap:8px} .mini{font-size:12px} </style></head><body><header><div class="topline"><h1>Meu Treino</h1><span class="pill" id="today"></span></div><small>Seu acompanhamento de musculação, offline</small></header><main><section id="home"></section><section id="session" class="hidden"></section><section id="library" class="hidden"></section><section id="history" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="tabs"><button data-tab="home" class="active">Hoje</button><button data-tab="session">Treinar</button><button data-tab="library">Biblioteca</button><button data-tab="history">Histórico</button><button data-tab="settings">Dados</button></nav><div id="toast"></div><input type="file" id="import" accept=".json,application/json" hidden><script>
const K='meutreino-v1'; const seed={plans:[{id:'a',name:'Treino A — Exemplo',notes:'Ficha demonstrativa: substitua por uma ficha personalizada importada.',exercises:[{id:'supino-maquina',sets:3,reps:'8–12',rest:90},{id:'elevacao-lateral',sets:3,reps:'12–15',rest:60},{id:'triceps-corda',sets:3,reps:'10–12',rest:60}]}],library:[{id:'supino-maquina',name:'Supino máquina',group:'Peito',equipment:'Máquina'},{id:'elevacao-lateral',name:'Elevação lateral',group:'Ombros',equipment:'Halteres'},{id:'triceps-corda',name:'Tríceps corda',group:'Tríceps',equipment:'Polia'},{id:'puxada-frontal',name:'Puxada frontal',group:'Costas',equipment:'Polia'},{id:'remada-baixa',name:'Remada baixa',group:'Costas',equipment:'Polia'},{id:'rosca-direta',name:'Rosca direta',group:'Bíceps',equipment:'Barra'},{id:'leg-press',name:'Leg press 45°',group:'Pernas',equipment:'Máquina'},{id:'cadeira-extensora',name:'Cadeira extensora',group:'Pernas',equipment:'Máquina'},{id:'cadeira-flexora',name:'Cadeira flexora',group:'Pernas',equipment:'Máquina'},{id:'panturrilha-sentado',name:'Panturrilha sentado',group:'Panturrilhas',equipment:'Máquina'}],history:[],active:null};
let db;try{db=JSON.parse(localStorage.getItem(K))||structuredClone(seed)}catch{db=structuredClone(seed)};function save(){localStorage.setItem(K,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}function date(s){return new Date(s).toLocaleString('pt-BR')}function ex(id){return db.library.find(x=>x.id===id)||{id,name:id,group:'Outros'}}function tab(t){document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hidden',x.id!==t));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render(t)}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));document.getElementById('today').textContent=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
function render(t){if(t==='home')home();if(t==='session')session();if(t==='library')library();if(t==='history')history();if(t==='settings')settings()}
function home(){let done=db.history.filter(h=>new Date(h.ended).toDateString()===new Date().toDateString()).length;document.getElementById('home').innerHTML=`<div class="card"><small>Treinos concluídos hoje</small><div class="stat">${done}</div><small>${db.history.length} sessões no histórico</small></div><h2>Minhas fichas</h2>${db.plans.map(p=>`<div class="card"><div class="topline"><b>${esc(p.name)}</b><span class="pill">${p.exercises.length} exercícios</span></div><p class="muted mini">${esc(p.notes||'')}</p><div class="actions"><button onclick="start('${esc(p.id)}')">Iniciar treino</button><button class="secondary" onclick="showPlan('${esc(p.id)}')">Ver ficha</button></div></div>`).join('')||'<p>Nenhuma ficha cadastrada. Importe um arquivo JSON em Dados.</p>'}`}
function showPlan(id){let p=db.plans.find(p=>p.id===id);if(!p)return;document.getElementById('home').innerHTML=`<button class="secondary" onclick="home()">← Voltar</button><h2>${esc(p.name)}</h2><p>${esc(p.notes||'')}</p>${p.exercises.map(e=>`<div class="card"><b>${esc(ex(e.id).name)}</b><p class="muted">${e.sets} séries · ${esc(e.reps)} repetições · ${e.rest||60}s descanso</p>${e.notes?`<small>${esc(e.notes)}</small>`:''}</div>`).join('')}<button onclick="start('${esc(p.id)}')">Iniciar</button>`}
function start(id){if(db.active&&!confirm('Já existe uma sessão em andamento. Substituí-la?'))return;let p=db.plans.find(x=>x.id===id);db.active={planId:id,started:new Date().toISOString(),items:p.exercises.map(e=>({id:e.id,rest:e.rest||60,notes:e.notes||'',sets:Array.from({length:e.sets},()=>({weight:'',reps:'',done:false}))}))};save();tab('session')}
function change(i,j,k,v){db.active.items[i].sets[j][k]=v;save()}function addSet(i){db.active.items[i].sets.push({weight:'',reps:'',done:false});save();session()}function session(){let a=db.active,el=document.getElementById('session');if(!a){el.innerHTML='<h2>Treino</h2><div class="card">Nenhuma sessão em andamento. Inicie uma ficha na aba Hoje.</div>';return}let p=db.plans.find(x=>x.id===a.planId);el.innerHTML=`<h2>${esc(p?.name||'Treino')}</h2><p class="muted">Iniciado em ${date(a.started)} · Salvo automaticamente</p>${a.items.map((item,i)=>`<div class="card"><div class="topline"><b>${esc(ex(item.id).name)}</b><span class="badge">Descanso ${item.rest}s</span></div>${item.notes?`<p class="muted mini">${esc(item.notes)}</p>`:''}<div class="set mini"><span>Série</span><span>kg</span><span>Reps</span><span>Feita</span></div>${item.sets.map((s,j)=>`<div class="set"><b>${j+1}</b><input inputmode="decimal" aria-label="Carga série ${j+1}" value="${esc(s.weight)}" onchange="change(${i},${j},'weight',this.value)"><input inputmode="numeric" aria-label="Repetições série ${j+1}" value="${esc(s.reps)}" onchange="change(${i},${j},'reps',this.value)"><input type="checkbox" aria-label="Concluir série ${j+1}" ${s.done?'checked':''} onchange="change(${i},${j},'done',this.checked)"></div>`).join('')}<button class="secondary" onclick="addSet(${i})">+ Série</button></div>`).join('')}<div class="card actions"><button onclick="finish()">Concluir treino</button><button class="secondary" onclick="toast('Sessão salva para continuar depois')">Pausar</button><button class="danger" onclick="discard()">Descartar</button></div>`}
function finish(){if(!db.active)return;if(!confirm('Concluir e salvar esta sessão?'))return;db.history.unshift({...db.active,ended:new Date().toISOString()});db.active=null;save();toast('Treino concluído!');tab('history')}function discard(){if(confirm('Descartar a sessão atual?')){db.active=null;save();tab('home')}}
function library(){let groups=[...new Set(db.library.map(e=>e.group))].sort();document.getElementById('library').innerHTML=`<h2>Biblioteca de exercícios</h2><p class="muted">Exercícios catalogados a partir do vídeo. Os números são os códigos originais visíveis na gravação. As imagens e demonstrações ainda não foram incluídas.</p><div class="card"><b id="libcount">${db.library.length} exercícios</b><p class="muted mini">Você pode buscar pelo nome ou código.</p><input id="q" placeholder="Buscar nome ou número (ex.: 83)" oninput="filterLib()"><label>Grupo muscular</label><select id="group" onchange="filterLib()"><option value="">Todos</option>${groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div><div id="results"></div>`;filterLib()}
function filterLib(){let q=(document.getElementById('q')?.value||'').toLowerCase().trim(),g=document.getElementById('group')?.value;let results=db.library.filter(e=>(!g||e.group===g)&&(`${e.name} ${e.originalNumber??''} ${e.equipment||''}`.toLowerCase().includes(q)));document.getElementById('results').innerHTML=`<p class="muted mini">${results.length} resultado(s)</p>`+results.map(e=>`<div class="card"><div class="topline"><b>${e.originalNumber!=null?'<span class="pill">'+e.originalNumber+'</span> ':''}${esc(e.name)}</b></div><div class="muted mini" style="margin-top:8px">${esc(e.group)}${e.source?' · Catálogo do vídeo':''}</div>${e.image?`<img alt="${esc(e.name)}" src="${esc(e.image)}" style="width:100%;max-height:240px;object-fit:contain;margin-top:10px" loading="lazy">`:'<p class="muted mini">Imagem demonstrativa ainda não disponível</p>'}${e.notes?`<p>${esc(e.notes)}</p>`:''}</div>`).join('')||'<p>Nenhum exercício encontrado.</p>'}
function history(){document.getElementById('history').innerHTML=`<h2>Histórico</h2>${db.history.map((h,i)=>`<div class="card"><div class="topline"><b>${esc(db.plans.find(p=>p.id===h.planId)?.name||h.planId)}</b><span class="pill">${new Date(h.ended).toLocaleDateString('pt-BR')}</span></div><p class="muted mini">${h.items.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0)} séries realizadas · ${Math.round((new Date(h.ended)-new Date(h.started))/60000)} min</p><details><summary>Ver séries</summary>${h.items.map(e=>`<p><b>${esc(ex(e.id).name)}</b><br>${e.sets.filter(s=>s.done).map(s=>`${esc(s.weight||'—')} kg × ${esc(s.reps||'—')}`).join(' · ')||'Nenhuma série marcada'}</p>`).join('')}</details></div>`).join('')||'<div class="card">Ainda não há sessões concluídas.</div>'}`}
function settings(){document.getElementById('settings').innerHTML=`<h2>Importação e backup</h2><div class="card"><b>Importar fichas ou biblioteca</b><p class="muted mini">Arquivo JSON com plans e/ou library. A importação mescla itens pelos respectivos IDs e mantém o histórico.</p><button onclick="document.getElementById('import').click()">Importar JSON</button></div><div class="card"><b>Exportar backup completo</b><p class="muted mini">Inclui fichas, biblioteca, sessão em andamento e histórico.</p><button onclick="exportJSON()">Exportar backup</button></div><div class="card"><b>Formato de importação</b><pre style="white-space:pre-wrap;font-size:12px;color:#c9ddcf">${esc(JSON.stringify({plans:[{id:'b',name:'Treino B',exercises:[{id:'puxada-frontal',sets:3,reps:'8-12',rest:90}]}],library:[{id:'puxada-frontal',name:'Puxada frontal',group:'Costas',equipment:'Polia'}]},null,2))}</pre></div>`}
function exportJSON(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Meu-Treino-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!d||typeof d!=='object'||(!Array.isArray(d.plans)&&!Array.isArray(d.library)))throw Error('Arquivo sem fichas ou biblioteca');if(d.library){for(let x of d.library){if(!x.id||!x.name||!x.group)throw Error('Exercício inválido');db.library=db.library.filter(y=>y.id!==x.id);db.library.push(x)}}if(d.plans){for(let p of d.plans){if(!p.id||!p.name||!Array.isArray(p.exercises))throw Error('Ficha inválida');db.plans=db.plans.filter(x=>x.id!==p.id);db.plans.push(p)}}save();toast('Importação concluída');tab('home')}catch(err){alert('Falha na importação: '+err.message)}e.target.value=''};async function syncVideoLibrary(){try{let response=await fetch('./biblioteca-video.json');if(!response.ok)return;let data=await response.json();let existing=new Set(db.library.map(x=>x.id));let added=0;for(let item of data.library){if(!existing.has(item.id)){db.library.push(item);existing.add(item.id);added++}}if(added)save();if(!document.getElementById('library').classList.contains('hidden'))library()}catch(e){console.warn('Catálogo indisponível offline na primeira abertura',e)}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});tab('home');syncVideoLibrary();
</script></body></html>
