<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f8f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Suas fichas de musculação, biblioteca de exercícios e evolução em um só lugar.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="stylesheet" href="./styles.css?v=4.0.0">
  <title>Meu Treino</title>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><rect x="2" y="11" width="5" height="10" rx="2" fill="currentColor"/><rect x="8" y="7" width="5" height="18" rx="2" fill="currentColor"/><path d="M13 16H19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><rect x="19" y="7" width="5" height="18" rx="2" fill="currentColor"/><rect x="25" y="11" width="5" height="10" rx="2" fill="currentColor"/></svg>
        </span>
        <div><div class="brand-title">Meu Treino</div><div class="brand-subtitle">Seu diário de musculação</div></div>
      </div>
      <button type="button" class="header-today" id="today" onclick="tab('home')" aria-label="Voltar à tela inicial"></button>
    </div>
  </header>
  <main id="appMain">
    <section id="home"></section>
    <section id="session" class="hidden"></section>
    <section id="library" class="hidden"></section>
    <section id="history" class="hidden"></section>
    <section id="stats" class="hidden"></section>
    <section id="settings" class="hidden"></section>
  </main>
  <button type="button" id="restTimer" class="timer hidden" aria-live="polite"></button>
  <nav class="tabs" aria-label="Navegação principal">
    <button type="button" data-tab="home" class="active" aria-label="Hoje">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></svg><span>Hoje</span>
    </button>
    <button type="button" data-tab="session" aria-label="Treinar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M7 7v10m10-10v10m3-7v4M7 12h10"/></svg><span>Treinar</span>
    </button>
    <button type="button" data-tab="library" aria-label="Biblioteca">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="7" height="8" rx="1.5"/><rect x="13" y="3" width="7" height="8" rx="1.5"/><rect x="4" y="13" width="7" height="8" rx="1.5"/><rect x="13" y="13" width="7" height="8" rx="1.5"/></svg><span>Biblioteca</span>
    </button>
    <button type="button" data-tab="history" aria-label="Histórico">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h3m-3 3h7"/></svg><span>Histórico</span>
    </button>
    <button type="button" data-tab="settings" aria-label="Mais opções">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg><span>Mais</span>
    </button>
  </nav>
  <div role="status" aria-live="polite" id="toast" class="toast"></div>
  <input id="import" type="file" accept=".json,application/json" hidden>
  <script src="./app.js?v=4.0.0" defer></script>
  <script src="./ui.js?v=4.0.0" defer></script>
</body>
</html>
